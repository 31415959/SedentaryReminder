plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sedentary.reminder'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.sedentary.reminder"
        minSdk 26
        targetSdk 36
        versionCode 24
        versionName "2.4.1"
    }

    signingConfigs {
        release {
            storeFile file('H:/SedentaryReminder/BuildEnv/keystore/release.jks')
            storePassword 'Sedentary2026'
            keyAlias 'sedentary'
            keyPassword 'Sedentary2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}



